<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illusionhost Agent IDE</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <img src="./assets/logo.png" alt="Illusionhost logo" class="logo" />
          <div class="brand-block">
            <div class="brand-title">Illusion<span>host</span></div>
            <div class="brand-sub">Agent Workspace</div>
          </div>
          <span id="statusPill" class="pill idle">Idle</span>
        </div>

        <div class="topbar-right">
          <select id="modeSelect" class="input compact">
            <option value="ask">Ask</option>
            <option value="code">Code</option>
          </select>
          <button id="themeToggle" class="btn compact ghost">Theme</button>
          <button id="saveConfig" class="btn compact">Save</button>
        </div>
      </header>

      <main class="workspace">
        <!-- LEFT: Context / Workspace -->
        <aside class="panel left">
          <section class="section">
            <h3>Workspace</h3>
            <label>Project ID</label>
            <input id="projectId" class="input" placeholder="project uuid" />

            <label>Owner</label>
            <input id="ownerInput" class="input" placeholder="taremwastudios" />

            <label>Repository</label>
            <input id="repoInput" class="input" placeholder="illusionhost-agentic-IDE" />

            <div class="row-2">
              <div>
                <label>Branch</label>
                <input id="branchInput" class="input" placeholder="main" />
              </div>
              <div>
                <label>File Path</label>
                <input id="filePathInput" class="input" placeholder="controller.py" />
              </div>
            </div>

            <label>Access Token</label>
            <input id="tokenInput" type="password" class="input" placeholder="Supabase bearer token" />
          </section>

          <section class="section">
            <h3>Session</h3>
            <label>Checkpoint ID</label>
            <input id="checkpointId" class="input" placeholder="checkpoint id" />
            <div class="stack">
              <button id="btnCheckpoint" class="btn">Create Checkpoint</button>
              <button id="btnRollback" class="btn danger">Rollback</button>
            </div>
          </section>
        </aside>

        <!-- CENTER: Agent Chat + Prompt -->
        <section class="panel center">
          <div class="center-head">
            <h3>Agent Thread</h3>
            <div class="meta-inline">
              <span class="meta-k">Mode</span>
              <span id="modeBadge" class="meta-v">ask</span>
            </div>
          </div>

          <div id="thread" class="thread"></div>

          <div class="composer">
            <textarea
              id="prompt"
              class="prompt"
              placeholder="Ask the agent to edit, explain, or implement changes..."
            ></textarea>
            <div class="composer-actions">
              <button id="btnRun" class="btn accent">Run Agent</button>
            </div>
          </div>
        </section>

        <!-- RIGHT: Code + API -->
        <aside class="panel right">
          <section class="section grow">
            <div class="section-head">
              <h3>Code Context</h3>
            </div>
            <textarea id="editor" class="editor" spellcheck="false"># Start editing...</textarea>
          </section>

          <section class="section">
            <div class="section-head">
              <h3>Response</h3>
            </div>
            <pre id="output" class="output"></pre>
          </section>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
