<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illusionhost Agent IDE</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="left-head">
          <img src="./assets/logo.png" alt="Illusionhost logo" class="logo" />
          <div>
            <p class="brand">Illusion<span>host</span></p>
            <p class="sub">AI Workspace</p>
          </div>
          <span id="statusPill" class="pill idle">Idle</span>
        </div>

        <div class="right-head">
          <select id="modeSelect" class="control compact">
            <option value="ask">Ask</option>
            <option value="code">Code</option>
          </select>
          <button id="themeToggle" class="btn compact ghost">Theme</button>
          <button id="btnRun" class="btn compact accent">Run Agent</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel left-panel">
          <section class="card">
            <h3>Session</h3>
            <div class="kv">
              <span>User</span>
              <strong id="sessionUser">Not detected</strong>
            </div>
            <div class="kv">
              <span>Project</span>
              <strong id="projectLabel">No project context</strong>
            </div>
            <div class="kv">
              <span>Repo</span>
              <strong id="repoLabel">No repo context</strong>
            </div>
            <div class="kv">
              <span>Branch</span>
              <strong id="branchLabel">No branch context</strong>
            </div>
            <p id="authHint" class="hint">Waiting for authenticated session...</p>
          </section>

          <section class="card">
            <h3>Checkpoint Control</h3>
            <label for="checkpointId">Checkpoint ID</label>
            <input id="checkpointId" class="control" placeholder="Checkpoint id" />
            <div class="stack">
              <button id="btnCheckpoint" class="btn">Create Checkpoint</button>
              <button id="btnRollback" class="btn danger">Rollback</button>
            </div>
          </section>
        </aside>

        <section class="panel center-panel">
          <div class="panel-head">
            <h3>Agent Thread</h3>
            <span id="modeBadge" class="badge">ask</span>
          </div>

          <div id="thread" class="thread"></div>

          <div class="composer">
            <textarea id="prompt" class="prompt" placeholder="Ask the agent to implement, refactor, or explain..."></textarea>
          </div>
        </section>

        <aside class="panel right-panel">
          <section class="card grow">
            <div class="panel-head">
              <h3>Editor</h3>
              <span class="hint">Monaco-ready</span>
            </div>
            <div id="monacoRoot" class="monaco-root"></div>
            <textarea id="editorFallback" class="editor" spellcheck="false"># Monaco not loaded. Fallback editor active.</textarea>
          </section>

          <section class="card">
            <h3>API Response</h3>
            <pre id="output" class="output"></pre>
          </section>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
